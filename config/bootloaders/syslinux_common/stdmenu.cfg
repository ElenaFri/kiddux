# stdmenu.cfg — style du menu d'amorçage BIOS (isolinux / vesamenu.c32) de Kiddux
# =============================================================================
# Surcharge le stdmenu.cfg de live-build pour habiller l'amorçage BIOS aux
# couleurs du projet (le menu texte bleu/gris standard devient aubergine +
# magenta), en pendant du thème GRUB (UEFI) et du splash Plymouth.
#
# Déposé via config/bootloaders/syslinux_common/ : binary_syslinux copie ce
# dossier PAR-DESSUS les modèles de live-build pour isolinux. Le fond splash.png
# (640x480, posé à côté) est chargé par « menu background ».
#
# Couleurs au format « menu color <élément> <ansi> <fg #AARRGGBB> <bg #AARRGGBB>
# <ombre> ». Teintes : aubergine #2D1535, magenta #A82E73 / #E07BE8, lavande
# #D9B3E0 / #B99FC4.
#
# NB : la police VGA de vesamenu ne rend pas les accents de façon fiable ; les
# messages ci-dessous sont donc volontairement sans accents.
# =============================================================================

# Fond : notre splash (aubergine + logo du projet + mot-symbole « debian 13 »).
menu background splash.png

# Titre « Boot menu » masqué (transparent) : la marque est déjà dans le fond.
menu color title        * #00000000 #00000000 none
menu color border       * #00000000 #00000000 none

# Entrees : lavande sur fond transparent ; selection blanche sur bandeau magenta.
menu color unsel        * #ffd9b3e0 #00000000 none
menu color hotkey       * #ffffffff #00000000 none
menu color sel          * #ffffffff #ffa82e73 none
menu color hotsel     1;7;37;40 #ffffffff #ffa82e73 none

# Messages (aide, invite, compte a rebours) dans les tons magenta / lavande.
menu color help         * #ffb99fc4 #00000000 none
menu color tabmsg       * #ffb99fc4 #00000000 none
menu color timeout_msg  * #ffb99fc4 #00000000 none
menu color timeout      * #ffe07be8 #00000000 none
menu color cmdmark      * #ffe07be8 #00000000 none
menu color cmdline      * #ffd9b3e0 #00000000 none

# Disposition : marque dans le tiers haut, menu dans la moitie basse.
menu vshift 14
menu rows 6
menu tabmsgrow 22
menu helpmsgrow 24
menu cmdlinerow 24
menu timeoutrow 25

menu tabmsg Entree : demarrer   -   Tab : modifier une entree
